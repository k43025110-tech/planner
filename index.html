<style>
:root{--a:#ffd400}body.red{--a:#ff3b30}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,'Segoe UI',Arial,sans-serif;background:radial-gradient(circle at 15% 0,#2b2b2b,#000 70%);color:#fff;min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg i{position:absolute;inset:0;opacity:0;will-change:opacity;animation:o 16s linear infinite}
.bg i:nth-child(1){background:radial-gradient(circle at 85% 12%,#ffd400,transparent 42%),radial-gradient(circle at 10% 85%,#ffd400,transparent 38%)}
.bg i:nth-child(2){animation-delay:4s;background:radial-gradient(circle at 15% 15%,#ff3b30,transparent 42%),radial-gradient(circle at 90% 80%,#ff3b30,transparent 38%)}
.bg i:nth-child(3){animation-delay:8s;background:radial-gradient(circle at 80% 20%,#fff,transparent 40%),radial-gradient(circle at 20% 82%,#fff,transparent 36%)}
.bg i:nth-child(4){animation-delay:12s;background:radial-gradient(circle at 18% 18%,#c3c7ce,transparent 42%),radial-gradient(circle at 85% 85%,#c3c7ce,transparent 38%)}
@keyframes o{0%{opacity:0}12%,25%{opacity:.32}37%,100%{opacity:0}}
body.red .bg i{animation:none;opacity:0}body.red .bg i:nth-child(2){opacity:.42}
main{position:relative;z-index:1;max-width:640px;margin:auto;padding:56px 16px 90px}
h1{text-align:center;font-weight:900;font-size:30px;color:var(--a);margin:10px 0 2px;text-shadow:0 0 18px var(--a)}
.tag{text-align:center;color:#ddd;margin:0 0 14px}
h2{font-size:21px;margin:18px 0 12px}
button{font:inherit;cursor:pointer}
button,.o,.m,.g,#mu{-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
.o{display:flex;align-items:center;justify-content:space-between;width:100%;background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.03));color:#fff;border:1.5px solid rgba(255,212,0,.55);border-radius:20px;padding:17px 18px;margin:12px 0;font-size:19px;font-weight:700;text-align:right;box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.2);transition:transform .18s,background .35s,color .35s,box-shadow .35s,border-color .35s}
.o::after{content:"‹";font-size:30px;line-height:1;color:var(--a)}
.o:active{transform:scale(.97);background:linear-gradient(145deg,#ffe45c,#ffb800);color:#000;border-color:#fff3a0;box-shadow:0 0 28px rgba(255,200,0,.8)}
.o:active::after{color:#000}
.m{display:block;width:100%;background:var(--a);background:linear-gradient(145deg,color-mix(in srgb,var(--a) 65%,#fff),var(--a));color:#000;border:0;border-radius:20px;padding:16px;margin:14px 0;font-size:20px;font-weight:900;box-shadow:0 8px 22px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.55);transition:transform .18s,filter .3s,box-shadow .3s}
.m:active{transform:scale(.97);filter:brightness(1.25);box-shadow:0 0 30px rgba(255,200,0,.85)}
.g{background:none;border:1.5px solid rgba(255,255,255,.25);border-radius:999px;color:#ddd;font-size:16px;padding:9px 20px;margin-top:8px;transition:background .3s,color .3s,border-color .3s}
.g:active{background:#ffd400;color:#000;border-color:#ffd400}
.r{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border-radius:14px;padding:10px 12px;margin:8px 0}
.r span{flex:1;font-weight:700}
input,select,textarea{font:inherit;background:#1a1a1a;color:#fff;border:1.5px solid var(--a);border-radius:10px;padding:8px}
input[type=checkbox],input[type=radio]{width:22px;height:22px;accent-color:var(--a)}
#nd,#nw,textarea{width:100%;margin:6px 0}
small{display:block;color:#bbb;margin:6px 0}
.day{content-visibility:auto;contain-intrinsic-size:auto 560px;background:rgba(255,255,255,.06);border:2px solid var(--a);border-radius:18px;margin:14px 0;overflow:hidden}
.day b{display:block;background:var(--ch,var(--a));color:var(--hx,#000);padding:10px 14px;font-size:18px}
.w{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid #333;font-size:15px;color:#000}
.w em{font-style:normal;white-space:nowrap}
.k-study3{background:var(--c3,#ffb4ad);--rc:var(--c3,#ffb4ad)}.k-study2{background:var(--c2,#fff0a0);--rc:var(--c2,#fff0a0)}.k-study1{background:var(--c1,#bff0b8);--rc:var(--c1,#bff0b8)}
.k-meal,.k-rest{background:var(--cm,#eee);--rc:var(--cm,#ddd)}.k-school{background:var(--cs,#d3e0ff);--rc:var(--cs,#d3e0ff)}.k-sleep{background:#1b1b2f;color:#fff;--rc:#1b1b2f}
.k-pray{background:linear-gradient(100deg,#fff,var(--cp,#ffd400) 55%,#fff);--rc:var(--cp,#ffd400);font-weight:900}
.sty-soft .w{background:#fff!important;color:#000;border-right:9px solid var(--rc)}.sty-soft .k-sleep{background:#1b1b2f!important;color:#fff}
.sty-card .w{margin:6px 8px;border-radius:12px;border:0;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.warn{background:#ff3b30;color:#fff;border-radius:14px;padding:12px;margin:10px 0;font-weight:700}
.sug{margin-top:34px;border-top:2px dashed var(--a);padding-top:16px}
#mu{transition:transform .18s,box-shadow .3s;display:none;position:fixed;bottom:16px;left:16px;z-index:5;width:54px;height:54px;border-radius:50%;border:0;background:var(--a);font-size:26px;box-shadow:0 0 16px var(--a)}
#mu:active{transform:scale(.9);box-shadow:0 0 30px #ffd400}
.o,.m,.g{position:relative;overflow:hidden}
.rp{position:absolute;border-radius:50%;background:rgba(255,212,0,.55);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
.m .rp{background:rgba(255,255,255,.7)}
@keyframes rp{to{transform:scale(1);opacity:0}}
#ts{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#ffd400;color:#000;font-weight:900;padding:10px 20px;border-radius:999px;z-index:9;display:none}
[hidden]{display:none!important}
.ic{font-style:normal;margin-left:10px}.o span{flex:1}
#vb{position:fixed;top:12px;left:12px;z-index:8;border:1.5px solid #ffd400;background:rgba(0,0,0,.75);color:#ffd400;font-weight:900;font-size:15px;padding:7px 14px;border-radius:999px;box-shadow:0 0 14px rgba(255,212,0,.45);transition:transform .18s,background .3s}
#vb:active{transform:scale(.93);background:#ffd400;color:#000}
body.vip #vb{border-color:#4cc9ff;color:#7fdcff;box-shadow:0 0 14px rgba(76,201,255,.6)}
#hb{position:fixed;inset:0;z-index:0;display:none;opacity:.4;pointer-events:none}body.vip #hb{display:block}
#vp{position:fixed;inset:0;z-index:30;background:#000;overflow:hidden}
#hc{position:absolute;inset:0}
#vp .vc{position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:50%;border:1.5px solid rgba(255,255,255,.5);background:rgba(0,0,0,.5);color:#fff;font-size:20px}
#vp .vt{position:absolute;top:16px;left:0;right:0;text-align:center;font-size:20px;font-weight:900;color:#7fdcff;text-shadow:0 0 14px #4cc9ff;pointer-events:none}
#vgo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:200px;height:62px;border-radius:31px;border:2px solid #4cc9ff;background:rgba(0,20,40,.6);color:#fff;font-size:25px;font-weight:900;box-shadow:0 0 26px #4cc9ff,inset 0 0 18px rgba(76,201,255,.35);animation:pu 2.2s ease-in-out infinite;transition:background .3s,color .3s}
#vgo:active{background:linear-gradient(145deg,#ffd27a,#ff8a1f);color:#000;border-color:#fff1c2}
@keyframes pu{50%{box-shadow:0 0 48px #4cc9ff,inset 0 0 24px rgba(76,201,255,.5)}}
.vl{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(0,10,30,.7);border:1.5px solid rgba(76,201,255,.7);color:#bfe9ff;border-radius:999px;padding:10px 22px;font-size:16px;font-weight:700;white-space:nowrap}
.vbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(86%,360px);background:rgba(2,12,28,.92);border:1.5px solid #4cc9ff;border-radius:22px;padding:18px;text-align:center;box-shadow:0 0 30px rgba(76,201,255,.45)}
.vbox input{width:100%;margin:10px 0;text-align:center;direction:ltr}
.vbox p{font-size:18px;line-height:1.8;margin:6px 0}
