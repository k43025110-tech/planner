const u=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
const $=i=>document.getElementById(i);
const lock=()=>{try{return Math.ceil(((+localStorage.getItem('l')||0)-Date.now())/1000)}catch(_){return 0}};
let fails=0;try{fails=+(localStorage.getItem('f')||0)}catch(_){}
let busy=false,timer=null;
function countdown(){
 clearTimeout(timer);const L=lock();
 if(L>0){$('g').disabled=true;$('e').textContent='⏳ محاولات كثيرة. انتظر '+L+' ثانية';timer=setTimeout(countdown,1000)}
 else if(!busy){$('g').disabled=false;if($('e').textContent.indexOf('⏳')===0)$('e').textContent=''}
}
const withTimeout=(p,ms,label)=>{let t;const to=new Promise((_,rej)=>{t=setTimeout(()=>rej(new Error('TIMEOUT:'+label)),ms)});return Promise.race([p,to]).finally(()=>clearTimeout(t))};
function live(src){const n=document.createElement('script');for(const a of src.attributes)n.setAttribute(a.name,a.value);n.textContent=src.textContent;n.async=false;return n}
function prep(n){if(n.nodeName==='SCRIPT')return live(n);const c=document.importNode(n,true);if(c.querySelectorAll)c.querySelectorAll('script').forEach(s=>s.replaceWith(live(s)));return c}
function mount(html){
 const d=new DOMParser().parseFromString(html,'text/html');
 const h=[...d.head.childNodes].map(prep),b=[...d.body.childNodes].map(prep);
 const r=d.documentElement;['lang','dir'].forEach(k=>r.getAttribute(k)&&document.documentElement.setAttribute(k,r.getAttribute(k)));
 document.head.replaceChildren(...h);document.body.replaceChildren(...b);
}
async function enter(){
 if(busy||lock()>0)return;
 const pw=$('p').value.normalize('NFC').trim();if(!pw)return;
 const sub=globalThis.crypto&&globalThis.crypto.subtle;
 if(!sub){$('e').textContent='المتصفح لا يدعم التشفير هنا. افتح الموقع عبر رابط https.';return}
 busy=true;$('g').disabled=true;$('e').textContent='⏳ جاري التحقق...';
 let text=null;
 try{
  const k0=await withTimeout(sub.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']),15000,'importKey');
  const k=await withTimeout(sub.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']),60000,'deriveKey');
  text=new TextDecoder().decode(await withTimeout(sub.decrypt({name:'AES-GCM',iv:u(D.v)},k,u(D.c)),15000,'decrypt'));
 }catch(x){
  if(x&&x.message&&x.message.indexOf('TIMEOUT:')===0){console.error(x);busy=false;$('g').disabled=false;$('e').textContent='⚠️ التحقق أخذ وقتاً طويلاً. أعد المحاولة.';return}
  if(x&&x.name&&x.name!=='OperationError'){console.error(x);busy=false;$('g').disabled=false;$('e').textContent='خطأ تقني ('+x.name+'). جرّب كروم محدّث.';return}
 }
 if(text!==null){
  try{localStorage.removeItem('f');localStorage.removeItem('l')}catch(_){}
  try{mount(text)}catch(x){console.error(x);busy=false;$('g').disabled=false;$('e').textContent='تعذر فتح البرنامج بعد فك التشفير. أعد تحميل الصفحة.'}return;
 }
 fails++;$('p').value='';
 const wait=Math.min(300,Math.max(0,(fails-2)*10));
 try{localStorage.setItem('f',fails);if(wait)localStorage.setItem('l',Date.now()+wait*1000)}catch(_){}
 busy=false;$('e').textContent='❌ كلمة السر غير صحيحة';
 if(wait>0)countdown();else{$('g').disabled=false;$('p').focus()}
}
$('g').addEventListener('click',enter);
$('p').addEventListener('keydown',e=>{if(e.key==='Enter')enter()});
$('sh').addEventListener('change',()=>{$('p').type=$('sh').checked?'text':'password'});
$('p').type=$('sh').checked?'text':'password';
window.addEventListener('error',e=>console.error(e.error||e.message));
$('p').focus();countdown();
})();</script></body></html>
